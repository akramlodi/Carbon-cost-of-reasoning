# Condition B -- LoRA. Base model frozen in bf16, RTX 4090 (24GB) or L4 (24GB).
# Rank ablation (r=8, r=32) is applied at runtime via `--rank`, not separate
# config files -- see scripts/run_experiment.py and scripts/run_matrix.sh.
method: lora
model_id: google/gemma-4-E2B-it

seed: 42
epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8      # effective batch size 16, matched across conditions
                                    # (was 8x2 -- reduced per-device batch so the
                                    # [batch, seq, 262144] fp32 logits tensor + its
                                    # softcapping copy fit on 24GB; gradient
                                    # checkpointing must stay on, see below)
learning_rate: 2e-4
max_seq_length: 512

bf16: true
gradient_checkpointing: true        # OOM'd at step 0 with this off; required to fit
                                    # on g5.xlarge (24GB) alongside the logits tensor
eval_every_pct: 0.2

output_dir: results/runs/lora

quantization:
  enabled: false

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  # target_modules intentionally omitted -- peft>=0.19's Gemma-4-aware
  # defaults correctly target the LM attention + MLP projections while
  # avoiding the Gemma4ClippableLinear-wrapped vision/audio modules.
  # See src/models.py::load_model for why an explicit list breaks LoRA
  # injection on this architecture.
