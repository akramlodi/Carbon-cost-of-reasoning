# Condition A -- Full Fine-Tuning. A100 40GB.
#
# Only the language-model transformer backbone (attention + MLP layers) is
# trainable -- NOT all 5.1B raw params gemma-4-E2B loads with. The audio
# encoder, vision encoder, speculative-decoding drafter, and embedder
# (including Per-Layer Embeddings) are frozen. Rationale (see CHANGES.md,
# "Change 1", for the full writeup):
#   1. Google freezes the audio/vision encoders during gemma-4's own
#      pretraining; GSM8K is text-only, so there's no gradient signal for
#      them anyway -- training them would just burn memory/compute for
#      nothing.
#   2. LoRA/QLoRA (configs/lora.yaml, configs/qlora.yaml) only adapt the
#      backbone's attention/MLP projections and never touch the embedder --
#      if Full FT trained the ~2.74B-param embedder too, the study would be
#      conflating "fine-tuning method" with "training scope", undermining
#      the accuracy/energy comparison the whole project rests on.
#   3. Reasoning ability lives in the transformer backbone; GSM8K introduces
#      no new vocabulary, so there's no reason to touch token embeddings.
#   4. Keeps Full FT's optimizer-state memory (AdamW moments scale with
#      *trainable* param count) within an A100 40GB budget instead of
#      needing an 80GB card for all 5.1B raw params.
method: full_ft
model_id: google/gemma-4-E2B-it

# Substring match against each parameter's full dotted name in
# model.named_parameters() -- any match freezes that parameter. CONFIRMED
# via scripts/check_full_ft_scope.py, but against google/gemma-4-E2B (the
# base checkpoint) -- model_id below was switched to the -it variant
# afterward, and these patterns have NOT been re-verified against it yet.
# "-it" checkpoints are normally the same architecture with different
# weights, so this should carry over unchanged, but re-run
# check_full_ft_scope.py once against -it before trusting this on the A100
# (cheap, T4, no training involved -- see CHANGES.md for the original run):
#   vision_tower  -> model.vision_tower.*            (vision encoder)
#   embed_vision  -> model.embed_vision.*            (vision->text fusion projection)
#   audio_tower   -> model.audio_tower.*             (audio encoder)
#   embed_audio   -> model.embed_audio.*             (audio->text fusion projection)
#   embed_tokens  -> model.language_model.embed_tokens
#                    and .embed_tokens_per_layer      (main + Per-Layer Embedding tables)
#
# Deliberately NOT frozen (stays trainable, part of the language backbone):
#   model.language_model.layers                  -- attention + MLP transformer blocks
#   model.language_model.norm                    -- final backbone layer norm
#   model.language_model.per_layer_model_projection
#   model.language_model.per_layer_projection_norm
#     -- these two integrate the per-layer embedding into each transformer
#        layer's forward pass; that's backbone computation (like any other
#        in-layer projection), not a static embedding lookup, so they're
#        treated as backbone rather than embedder.
#
# There is no separate speculative-decoding drafter module in the base
# checkpoint -- confirmed via a full-name keyword scan, not just absent
# from a truncated listing. (Not yet re-confirmed on -it; see above.)
#
# Result on the base checkpoint: 1,877,105,920 / 5,104,297,504 trainable
# (~36.78%), matching CHANGES.md's ~1.87B/5.1B backbone estimate closely.
frozen_modules:
  - vision_tower
  - embed_vision
  - audio_tower
  - embed_audio
  - embed_tokens

seed: 42
epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4      # effective batch size 16, matched across conditions
learning_rate: 2e-5
max_seq_length: 512

bf16: true
gradient_checkpointing: true        # required to control memory for full FT
eval_every_pct: 0.2                 # log an intermediate checkpoint every 20% of training

output_dir: results/runs/full_ft

quantization:
  enabled: false

lora:
  enabled: false
