# Condition C -- QLoRA. Base model in 4-bit NF4, L4 (16-24GB).
# Same adapter config as configs/lora.yaml for direct comparability.
# Rank ablation (r=8, r=32) is applied at runtime via `--rank`.
method: qlora
model_id: google/gemma-4-E2B-it

seed: 42
epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 8      # effective batch size 16, matched across conditions
                                    # (was 8x2 -- 4-bit quantization shrinks the
                                    # weights but NOT the [batch, seq, 262144] logits
                                    # tensor, which is the same size here as under LoRA)
learning_rate: 2e-4
max_seq_length: 512

bf16: true
gradient_checkpointing: true        # reduces activation memory during QLoRA training
eval_every_pct: 0.2

output_dir: results/runs/qlora

quantization:
  enabled: true
  quant_type: nf4
  double_quant: true

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  # target_modules intentionally omitted -- see configs/lora.yaml and
  # src/models.py::load_model. Same reasoning applies under 4-bit
  # quantization (Linear4bit is also wrapped in Gemma4ClippableLinear).
